# ---------------------------------------------------------------------------
# Terminal / colour
# ---------------------------------------------------------------------------
set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# `Tc` is the old capability name; `RGB` is the one tmux 3.x and most TUIs probe
# for. WezTerm reports TERM=xterm-256color, whose terminfo entry lacks RGB, so
# without this `tmux info` shows "RGB: [missing]" and anything that trusts
# terminfo assumes 256 colours.
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0

# Claude Code clamps itself to the 256-colour palette whenever $TMUX is set —
# a defensive heuristic from before COLORTERM was standard. The visible symptom
# is the mascot and welcome box rendering as pink (colour 174, #d787af) instead
# of Claude orange (#d97757). This opts out of the clamp; verify with
#   tmux capture-pane -p -e | grep -o '38;2;[0-9;]*'   (truecolor = fixed)
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Claude Code polls for focus so it can pause/resume its spinner and stop
# stealing the cursor while you are in another pane. Off by default in tmux.
set -g focus-events on

# Long AI transcripts blow through the 2000-line default scrollback in one turn.
set -g history-limit 50000

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
# Wheel scroll inside a TUI that does not use the alternate screen (Claude Code,
# a plain shell) needs mouse mode; without it the wheel does nothing and Claude
# nags you to turn it on. Keyboard scrollback (prefix [ , PgUp/PgDn) still works.
set -g mouse on
# With mouse on, a drag selects into a *tmux* buffer instead of the terminal's,
# so make the drag end land in the macOS clipboard like `y` already does.
# (Hold Option in WezTerm to bypass tmux and use a native terminal selection.)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

bind r source-file ~/.tmux.conf
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g base-index 1

# A breathing row between the pane and the status bar, so a full-height TUI
# (Claude Code's status line, say) does not sit flush against the grey bar.
#
# tmux fills the status area downward from status-format[0], so the blank has
# to BE line [0] and the real bar has to move to [1]. Three details make that
# work: `set -gu status-format` restores the whole array to its built-in
# defaults, which is both how we get a copy of the stock bar and what keeps
# this idempotent under `bind r` — unsetting a single index deletes it instead,
# leaving the bar blank. And the spacer uses `fill=` rather than `bg=`: a bare
# style change only colours text drawn after it, so an empty row would keep the
# status background and read as a double-height bar, not as a gap.
set -g status 2
run-shell 'tmux set -gu status-format ; tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")" ; tmux set -g "status-format[0]" "#[fill=terminal]"'

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "sh -c 'test -e TODO.md && nvim TODO.md || nvim ~/TODO.md'"

# ---------------------------------------------------------------------------
# Sessionizer
# ---------------------------------------------------------------------------
# Ctrl-f is bound in fish too, but a fish binding only fires at a fish prompt —
# inside a full-screen TUI (Claude Code, lazygit, a pager) the keystroke goes to
# that program instead. A root-table tmux binding is intercepted by tmux first,
# so the same reflex works from anywhere inside a session.
#
# Exception: programs that legitimately own Ctrl-f (vim/less/man page-forward,
# fzf) get it passed through. `if-shell -F` evaluates a tmux format, so this
# costs no subprocess.
bind -n C-f if-shell -F '#{m/ri:^(g?(view|n?vim?x?)(diff)?|less|more|man|fzf)$,#{pane_current_command}}' \
  'send-keys C-f' \
  'display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer"'

# Same picker from the prefix table. Note the popup: fzf needs a real tty, which
# `run-shell` does not give it — the old `run-shell` binding here silently did
# nothing.
bind f display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer"

# One directory maps to one session, so a second jump to a project you are
# already in just switches you back. prefix-F makes an *additional* session for
# the same directory — `dotfiles-review`, `dotfiles-refactor` — which is how you
# run two Claude Code conversations on one repo without them sharing a pane.
# Empty label = the next free `<project>-2`, `-3`, …
# Two traps, both of which fail *silently*, are why the directory is passed this
# particular way:
#   1. `run-shell -c` takes a literal path and does NOT expand formats. With
#      `-c "#{pane_current_path}"` the directory is invalid, run-shell quietly
#      falls back to $HOME, and you get a session named after your home folder.
#      The command string, by contrast, IS format-expanded against the target pane.
#   2. run-shell uses `default-shell`, which here is fish — so the POSIX
#      `VAR=value cmd` assignment prefix is a syntax error, not an assignment.
#      `env` works in every shell.
bind F command-prompt -p "extra session for this dir (label):" \
  'run-shell -b "env TS_HERE_DIR=\"#{pane_current_path}\" ~/.local/bin/tmux-session-here %%"'

# The common case of the above: a second Claude to *ask* something while the
# first one is mid-edit. `--permission-mode plan` makes it read-only, so it can
# read the tree and answer without racing the agent that is writing to it.
# One sidecar per project — pressing this again returns to the same `<project>-ask`.
bind A run-shell -b \
  'env TS_HERE_DIR="#{pane_current_path}" ~/.local/bin/tmux-session-here ask "claude --permission-mode plan"'

# Same tty problem as `bind f` had: tmux-cht.sh runs fzf and then `read -p`,
# neither of which works under run-shell.
bind i display-popup -E -w 80% -h 70% "~/.local/bin/tmux-cht.sh"
