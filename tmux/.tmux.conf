# ---------------------------------------------------------------------------
# Terminal / colour
# ---------------------------------------------------------------------------
set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# `Tc` is the old capability name; `RGB` is the one tmux 3.x and most TUIs probe
# for. WezTerm reports TERM=xterm-256color, whose terminfo entry lacks RGB, so
# without this `tmux info` shows "RGB: [missing]" and anything that trusts
# terminfo assumes 256 colours.
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 0

# Shift+Enter (Claude Code's "newline, don't submit") dies at the tmux boundary
# without these two. Modified keys only survive if BOTH halves of the trip are
# arranged:
#   1. `extkeys` tells tmux the outer terminal groks modified keys, so tmux asks
#      WezTerm for them. Without it WezTerm sends a bare \r for Shift+Enter and
#      there is nothing left for tmux to forward.
#   2. `extended-keys on` lets a program inside the pane request them. Note that
#      `always` is NOT the stronger setting it sounds like: it forces xterm's
#      *mode 1*, which by definition only re-encodes keys that lack a well-known
#      representation — and Enter has one, so Shift+Enter stays a plain \r.
#      Mode 2 is the one that re-encodes everything, and only `on` leaves the
#      program free to ask for it.
# csi-u makes the result `^[[13;2u`, the same encoding Claude Code already sees
# from WezTerm outside tmux, rather than xterm's `^[[27;2;13~`.
# Verify with:  printf '\033[>4;2m'; /bin/cat -v   then press Shift+Enter
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -s extended-keys-format csi-u

# Claude Code clamps itself to the 256-colour palette whenever $TMUX is set —
# a defensive heuristic from before COLORTERM was standard. The visible symptom
# is the mascot and welcome box rendering as pink (colour 174, #d787af) instead
# of Claude orange (#d97757). This opts out of the clamp; verify with
#   tmux capture-pane -p -e | grep -o '38;2;[0-9;]*'   (truecolor = fixed)
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Claude Code polls for focus so it can pause/resume its spinner and stop
# stealing the cursor while you are in another pane. Off by default in tmux.
set -g focus-events on

# Long AI transcripts blow through the 2000-line default scrollback in one turn,
# and with `tui: default` the whole conversation lives in tmux's buffer rather
# than in Claude's own virtualised one — so this is the only history there is.
# Applied when a pane is created: `bind r` re-sources but does NOT retroactively
# grow the buffer of panes that already exist.
set -g history-limit 200000

# Tell the OUTER terminal which session this is.
#
# Off by default, and the default is what made the WezTerm window title stale:
# fish emits a title sequence on every `cd`, tmux swallows it rather than passing
# it outward, so the terminal kept whatever title it was handed before tmux
# attached — and the sessionizer jumping to a new path was invisible to it.
#
# `#S` rather than a path: the sessionizer names sessions after the directory you
# jumped to, so the session name IS the location, and it stays put while you move
# around inside it. A path would go stale again the moment you cd within a session.
set -g set-titles on
set -g set-titles-string "#S"

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
# OFF, deliberately, since 2026-08-11. With mouse on, EVERY gesture in a plain
# pane — wheel, drag-select, double/triple-click — enters copy mode, and tmux
# 3.7's copy-mode entry could abort the whole SERVER under macOS 26's system
# allocator (upstream tmux#5302 / tmux#5385; stack bottoms out in
# window_copy_clone_screen <- grid_free_line <- SIGABRT), taking every session
# with it. Four crashes in one day, each with the mouse in hand. Two layers now:
#   1. The allocator fix: tmux here is a local jemalloc-linked 3.7c build at
#      ~/.local/bin/tmux (Homebrew's 3.7b is unlinked — see README).
#   2. This: the whole trigger surface off. No mouse event reaches tmux at all,
#      so no gesture can enter copy mode. Scrollback is keyboard-only
#      (prefix [), which the scroll-resume bindings below already assume.
# Costs, accepted: Claude Code nags that the wheel does nothing, and text
# selection is WezTerm-native again (no tmux buffer). If mouse ever returns,
# also restore the MouseDragEnd1Pane -> pbcopy binding this block replaced
# (it is in this file's git history) so drags land in the macOS clipboard.
set -g mouse off

# r revives, R reloads — flipped deliberately: after a server death, reviving
# the pane's Claude is the frequent motion and reload is the rare one.
# The pane id is passed as an argument for the same reason tmux-open-url's
# binding passes it: never trust an inherited environment to name the pane.
bind r run-shell "~/.local/bin/claude-tmux-revive '#{pane_id}'"
bind R source-file ~/.tmux.conf
set -g base-index 1

# Claude Code's native binary is installed under its version number, so
# #{pane_current_command} reads "2.1.226" — which is what automatic-rename
# would print on the window pill. No real command starts with a digit, so
# "starts with a digit" is the Claude detector: those windows take the
# Claude branch below. Everything else keeps the stock behaviour of showing
# its running command.
# The Claude branch renders the pane title — the live conversation summary
# Claude streams into #T — stripped of its spinner glyph and truncated to 24
# columns so the pill stays a pill. Until Claude's first title write lands,
# the pill falls back to a static "Claude" label instead of showing
# placeholder text; the guard covers BOTH shapes that placeholder takes here:
# the bare hostname (tmux's own default #T, before anything has touched it)
# and fish's preexec title "claude <pwd>" — fish's fish_title rewrites #T on
# every prompt/preexec, so the instant the `claude` command execs the pane's
# title is already "claude ~/some/path", not the hostname; hostname alone
# never covers that window. The preexec match is anchored on the path shape
# ("claude ~..." or "claude /...") rather than a bare "claude " prefix, so a
# genuine conversation summary that happens to start with "claude " (this
# repo's own transcripts are full of them, e.g. "claude code hooks
# research") passes through instead of being swallowed by the placeholder.
# Manually named windows never get here: a manual rename turns
# automatic-rename off, and the deliberate name is pushed INTO Claude instead
# (claude-tmux-name, below).
set -g automatic-rename-format '#{?#{m:[0-9]*,#{pane_current_command}},#{?#{||:#{==:#{pane_title},#{host}},#{||:#{m:claude ~*,#{pane_title}},#{m:claude /*,#{pane_title}}}},Claude,#{=24:#{s/^[^a-zA-Z0-9]+ ?//:pane_title}}},#{pane_current_command}}'
# Close a window and the ones after it slide down, so prefix+1..N is always
# contiguous — same packing behaviour as hyper+number desktop slots.
set -g renumber-windows on

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# ---------------------------------------------------------------------------
# Come back to where you left off in copy mode
# ---------------------------------------------------------------------------
# tmux has vi-style marks — `X` sets one, `M-x` jumps to it — but they live in
# the copy-mode state, which is freed the moment you leave copy mode. Set a
# mark, press q, come back, press M-x: still at the bottom. So stash the
# position ourselves, on the way out.
#
# Two numbers, and both are load-bearing:
#
#   1. An ABSOLUTE scrollback index (history_size - scroll_position), not the
#      scroll offset. The offset is measured from the bottom, and the bottom
#      moves every time the pane prints another line, so resuming by offset
#      after a command has run lands you somewhere else entirely.
#   2. The cursor's row on screen. Restoring only the view puts the cursor back
#      on the top line, which reads as landing a screenful too high.
#
# `run-shell` is what makes the save possible at all: its command string is
# format-expanded against the target pane, so #{scroll_position} is read at the
# instant the key is pressed, before the cancel takes the state away.
#
# Only q and Escape record. y, Enter and mouse-drag-release leave through
# copy-pipe-and-cancel, where you have finished with the position rather than
# parked on it. `set -p` makes the memory per-pane.
bind -T copy-mode-vi q      run-shell 'tmux set -p -t "#{pane_id}" @scroll_resume "#{e|-:#{history_size},#{scroll_position}}"; tmux set -p -t "#{pane_id}" @scroll_resume_y "#{copy_cursor_y}"; tmux send-keys -t "#{pane_id}" -X cancel'
bind -T copy-mode-vi Escape run-shell 'tmux set -p -t "#{pane_id}" @scroll_resume "#{e|-:#{history_size},#{scroll_position}}"; tmux set -p -t "#{pane_id}" @scroll_resume_y "#{copy_cursor_y}"; tmux send-keys -t "#{pane_id}" -X cancel'

# `'` is vim's own "back to where I was", and is free here — `^` is already
# back-to-indentation, exactly as in vim. Guarded so that pressing it in a pane
# with nothing saved is a silent no-op rather than a shell error in the status
# line.
bind -T copy-mode-vi "'"    run-shell 'a="#{@scroll_resume}"; y="#{@scroll_resume_y}"; h="#{history_size}"; p="#{pane_id}"; tmux send-keys -t "$p" -X history-bottom; if [ -n "$a" ]; then n=$((h - a)); if [ "$n" -gt 0 ]; then tmux send-keys -t "$p" -X -N "$n" scroll-up; tmux send-keys -t "$p" -X top-line; if [ "${y:-0}" -gt 0 ]; then tmux send-keys -t "$p" -X -N "$y" cursor-down; fi; fi; fi'

bind -r ^ last-window

# Nudge the current window left/right one slot; repeatable, so prefix < < <
# walks it across the bar. `-d` keeps focus on the window being moved.
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "sh -c 'test -e TODO.md && nvim TODO.md || nvim ~/TODO.md'"

# ---------------------------------------------------------------------------
# Sessionizer
# ---------------------------------------------------------------------------
# Ctrl-f is bound in fish too, but a fish binding only fires at a fish prompt —
# inside a full-screen TUI (Claude Code, lazygit, a pager) the keystroke goes to
# that program instead. A root-table tmux binding is intercepted by tmux first,
# so the same reflex works from anywhere inside a session.
#
# Exception: programs that legitimately own Ctrl-f (vim/less/man page-forward,
# fzf) get it passed through. `if-shell -F` evaluates a tmux format, so this
# costs no subprocess.
bind -n C-f if-shell -F '#{m/ri:^(g?(view|n?vim?x?)(diff)?|less|more|man|fzf)$,#{pane_current_command}}' \
  'send-keys C-f' \
  'display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer"'

# Same picker from the prefix table. Note the popup: fzf needs a real tty, which
# `run-shell` does not give it — the old `run-shell` binding here silently did
# nothing.
bind f display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer"

# One directory maps to one session, so a second jump to a project you are
# already in just switches you back. prefix-F makes an *additional* session for
# the same directory — `dotfiles-review`, `dotfiles-refactor` — which is how you
# run two Claude Code conversations on one repo without them sharing a pane.
# Empty label = the next free `<project>-2`, `-3`, …
# Two traps, both of which fail *silently*, are why the directory is passed this
# particular way:
#   1. `run-shell -c` takes a literal path and does NOT expand formats. With
#      `-c "#{pane_current_path}"` the directory is invalid, run-shell quietly
#      falls back to $HOME, and you get a session named after your home folder.
#      The command string, by contrast, IS format-expanded against the target pane.
#   2. run-shell uses `default-shell`, which here is fish — so the POSIX
#      `VAR=value cmd` assignment prefix is a syntax error, not an assignment.
#      `env` works in every shell.
bind F command-prompt -p "extra session for this dir (label):" \
  'run-shell -b "env TS_HERE_DIR=\"#{pane_current_path}\" ~/.local/bin/tmux-session-here %%"'

# The common case of the above: a second Claude to *ask* something while the
# first one is mid-edit. `--permission-mode plan` makes it read-only, so it can
# read the tree and answer without racing the agent that is writing to it.
# One sidecar per project — pressing this again returns to the same `<project>-ask`.
bind A run-shell -b \
  'env TS_HERE_DIR="#{pane_current_path}" ~/.local/bin/tmux-session-here ask "claude --permission-mode plan"'

# ---------------------------------------------------------------------------
# Claude session <-> window naming
# ---------------------------------------------------------------------------
# A deliberate window rename (prefix+,) becomes the Claude session's title:
# claude-tmux-name uniqueness-checks the name per project (suffixing -2, -3
# in the tmux-session-here tradition), renames the window to the final
# result, types /rename into the window's Claude pane and VERIFIES the title
# actually changed — one retry, then a status-line complaint. The harness
# guards its own re-entry (its rename-window re-fires this hook) via the
# @claude_naming window option, so no guard is needed here.
set-hook -g after-rename-window 'run-shell -b "~/.local/bin/claude-tmux-name --from-hook \"#{session_name}:#{window_index}\""'

# Same tty problem as `bind f` had: tmux-cht.sh runs fzf and then `read -p`,
# neither of which works under run-shell.
bind i display-popup -E -w 80% -h 70% "~/.local/bin/tmux-cht.sh"

# ---------------------------------------------------------------------------
# Links out of the pane you are reading
# ---------------------------------------------------------------------------
# Scrape this pane for URLs, pick one, open it in the Chrome profile that this
# pane's DIRECTORY belongs to — so a link from a client's folder lands in that
# client's browser rather than in whichever window happened to be frontmost.
#
# `#{pane_id}` is passed as an argument and must be. Inside a popup $TMUX_PANE
# names the POPUP, so a script trusting the environment would scrape the empty
# box it is drawing itself into and report that the pane has no links.
#
# The directory is not passed at all: given the pane id, the script asks tmux for
# `#{pane_current_path}` itself. A popup does inherit the pane's directory,
# measured — but the whole feature turns on which directory is asked about, and
# that is too load-bearing to leave resting on an inherited default.
#
# Routing needs the private `identity` repo. Without it the script still opens
# the link, unrouted; see the note at the top of tmux-open-url.
bind u display-popup -E -w 80% -h 70% \
  "~/.local/bin/tmux-open-url '#{pane_id}'"

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
# TPM self-bootstraps so a fresh machine gets the theme on first launch
# instead of a broken bar and a manual clone step. `install_plugins` runs in
# the same breath so that first launch is also fully themed, not
# themed-after-remembering-prefix-I.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# Catppuccin's default pill text is #T, the pane *title* — which Claude Code
# rewrites every turn with a conversation summary, burying the window *name*
# that prefix+, edits and making renames look broken. Show #W instead: the
# name automatic-rename controls (see automatic-rename-format above) and a
# manual rename overrides for good. Claude's title stream still exists on #T,
# just no longer drawn here.
#
# The current-window label injects its own style on purpose: the plugin
# hardcodes the label foreground to light @thm_fg, which would be unreadable
# on the solid accent pill below — this is the one seam where a fg override
# can ride in. Crust + bold on the accent reads 9:1 or better.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #[fg=#{@thm_crust},bold]#W"

# Pill colours. These options are pasted into window-status-format verbatim
# and expanded per window at render time, which is what lets a conditional
# colour each pill by what runs in it: the digit test is the same Claude
# detector automatic-rename-format uses above, so Claude windows carry a
# peach number block whether focused or not.
#
# Contrast is the point of every override (ratios are crust text on the
# number block / vs the mocha base the bar sits on):
#   - inactive number: overlay_2 -> subtext_0, 6.6:1 -> 10:1, so the number
#     is readable without the pill shouting. (This theme file's subtext_0 is
#     the BRIGHTER #bac2de — its hexes are swapped relative to upstream.)
#   - active pill: fully lit but still two-tone — the number and label halves
#     take two shades of the same family so the split stays visible. Claude
#     glows up from its idle peach to yellow|peach; everything else goes
#     mauve|lavender. Dark bold label injected via
#     @catppuccin_window_current_text above (crust is 8:1+ on all four).
set -g @catppuccin_window_number_color "#{?#{m:[0-9]*,#{pane_current_command}},#{@thm_peach},#{@thm_subtext_0}}"
set -g @catppuccin_window_current_number_color "#{?#{m:[0-9]*,#{pane_current_command}},#{@thm_yellow},#{@thm_mauve}}"
set -g @catppuccin_window_current_text_color "#{?#{m:[0-9]*,#{pane_current_command}},#{@thm_peach},#{@thm_lavender}}"

# Window pills start at the left edge (behind the mode pills below);
# everything informational lives on the right. `#{E:...}` expands at render
# time, so these can be set before TPM actually loads the plugin.
set -g status-left-length 100
set -g status-right-length 100
# nvim-style mode pills, drawn only while the pane is in copy-mode: COPY
# (sky) reading scrollback, upgraded to VISUAL (mauve) the instant a
# selection starts, SEARCH (green) appended while search results are
# active. Empty when live, so the window pills keep the left edge and
# slide right while a pill shows — the shift is a cue, not a bug.
#
#   - The gate is `#{==:#{pane_mode},copy-mode}`, not `#{pane_in_mode}`:
#     the latter is also true in choose-tree and view-mode, where a COPY
#     pill would lie.
#   - `selection_active`, not `selection_present`: present only flips once
#     the selection is non-empty, which would lag the pill one keystroke
#     behind `v`. Starting a selection drops an existing search highlight
#     (tmux clears the marks), so SEARCH honestly disappears with it.
#   - Three appended segments, one state each; the first two are mutually
#     exclusive, SEARCH rides beside either. Styles inside the branches
#     are space-separated (`bg=x bold`), so no comma ever needs a `#,`
#     escape from the surrounding conditional.
#   - SEARCH means results are active in the pane. While the query is
#     still being typed at / or ?, tmux shows its own prompt here anyway.
set -g status-left "#{?#{&&:#{==:#{pane_mode},copy-mode},#{selection_active}}, #[fg=#{@thm_mauve} bg=default]#[fg=#{@thm_crust} bg=#{@thm_mauve} bold] VISUAL #[fg=#{@thm_mauve} bg=default]#[default] ,}"
set -ag status-left "#{?#{&&:#{==:#{pane_mode},copy-mode},#{==:#{selection_active},0}}, #[fg=#{@thm_sky} bg=default]#[fg=#{@thm_crust} bg=#{@thm_sky} bold] COPY #[fg=#{@thm_sky} bg=default]#[default] ,}"
set -ag status-left "#{?#{&&:#{==:#{pane_mode},copy-mode},#{search_present}},#[fg=#{@thm_green} bg=default]#[fg=#{@thm_crust} bg=#{@thm_green} bold] SEARCH #[fg=#{@thm_green} bg=default]#[default] ,}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Sessions survive a reboot: resurrect saves sessions/windows/layouts/cwds,
# continuum re-saves every 15 minutes and restores when the server next
# starts. Pane text comes back as static content — orientation, not live
# programs. Deliberately default everywhere else: no custom process list
# (relaunched panes stay text-only by design; the way back into each
# conversation is prefix+r, which types the exact `claude --resume <uuid>`
# via the manifest written at each autosave), no nvim session strategy.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# At every autosave, snapshot which Claude conversation lives in which pane
# (claude-tmux-manifest). Written at the save instant, so the manifest always
# matches the layout resurrect will rebuild; prefix+r consumes it after a
# restore to type the exact `claude --resume <uuid>` back into each pane.
set -g @resurrect-hook-post-save-all "$HOME/.local/bin/claude-tmux-manifest"

set -g @plugin 'tmux-plugins/tpm'
# Pinned: catppuccin rewrote its whole options API between v0.x and v2, so an
# upstream change should be an explicit upgrade here, never a surprise on the
# next machine that clones this repo.
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
# Continuum stays LAST in this list: on load it plants its autosave hook
# (#(continuum_save.sh)) inside status-right, and anything that rewrites the
# bar after it disarms the autosave silently.
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'

# TPM wants to be the last line of the file. The spacer block below is the
# one deliberate exception: it must run after the theme has loaded.
run '~/.tmux/plugins/tpm/tpm'

# A breathing row between the pane and the status bar, so a full-height TUI
# (Claude Code's status line, say) does not sit flush against the grey bar.
#
# tmux fills the status area downward from status-format[0], so the blank has
# to BE line [0] and the real bar has to move to [1]. Three details make that
# work: `set -gu status-format` restores the whole array to its built-in
# defaults, which is both how we get a copy of the stock bar and what keeps
# this idempotent under `bind r` — unsetting a single index deletes it instead,
# leaving the bar blank. And the spacer uses `fill=` rather than `bg=`: a bare
# style change only colours text drawn after it, so an empty row would keep the
# status background and read as a double-height bar, not as a gap.
# Lives after TPM on purpose: the copied row [1] is tmux's *default* bar
# format, which pulls status-left/right and window-status-* by option name,
# so catppuccin's styling flows into it — but only if nothing re-themes the
# bar after the copy is taken.
set -g status 2
run-shell 'tmux set -gu status-format ; tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")" ; tmux set -g "status-format[0]" "#[fill=terminal]"'
