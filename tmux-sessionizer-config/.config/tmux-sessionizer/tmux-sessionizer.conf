# ~/.config/tmux-sessionizer/tmux-sessionizer.conf
# Bash array syntax (sourced by tmux-sessionizer script)

TS_SEARCH_PATHS=(~/ ~/Documents/Projects)
# Depth suffixes are relative to their own path. Keep unsuffixed entries first:
# the script does not reset $depth between iterations, so a :N leaks rightward.
#
# esetup gets its own entry because its children are one level too deep:
# ~/Documents/Projects reaches setup/esetup at TS_MAX_DEPTH=2 and stops there,
# so the submodules and sibling repos inside it were never candidates. Raising
# TS_MAX_DEPTH to 3 would reach them and also widen ~/ and ~/Documents/Projects
# by a level, which is most of the picker. A scoped :1 buys the eleven entries
# wanted and nothing else, and new submodules are picked up with no edit here.
TS_EXTRA_SEARCH_PATHS=(
    ~/.config:2
    ~/Documents/Learning:1
    ~/work:2
    ~/Documents/Projects/setup/esetup:1
)
TS_MAX_DEPTH=2
# TS_SESSION_COMMANDS=()
# TS_LOG=true
