# ~/.config/tmux-sessionizer/tmux-sessionizer.conf
# Bash array syntax (sourced by tmux-sessionizer script)

TS_SEARCH_PATHS=(~/ ~/Documents/Projects)
# Depth suffixes are relative to their own path. Keep unsuffixed entries first:
# the script does not reset $depth between iterations, so a :N leaks rightward.
TS_EXTRA_SEARCH_PATHS=(~/.config:2 ~/Documents/Learning:1 ~/work:2)
TS_MAX_DEPTH=2
# TS_SESSION_COMMANDS=()
# TS_LOG=true
