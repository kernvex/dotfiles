add_newline = false

[character]
vicmd_symbol = "[█](bold yellow) "
success_symbol = "[█](bold #CC59B0) "
error_symbol = "[█](bold red) "
format = " -> "

[username]
style_user = "fg:#CC99CC"
style_root = "white"
format = " [$user]($style)[@](bold yellow)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format =  "[$hostname](bold fg:#CC59B0): "
disabled = false

[directory]
read_only = "🔒"
read_only_style= "bold white"
style = "fg:#A7F3E4"

[docker_context]
format = "via [🐋 $context](blue bold)"

[cmd_duration]
min_time = 50
format = "⌛️[$duration](bold yellow)"

[aws]
disabled = true

# Speak only where a gcloud identity is actually routed.
#
# By default this module renders wherever it can read an active gcloud config,
# and the personal one qualifies: ~/.config/gcloud/active_config names "default"
# while configurations/config_default is an EMPTY file. So the module found a
# config, parsed no account out of it, and drew a bare ☁ with nothing after it —
# in every unrouted folder, which is most of them.
#
# CLOUDSDK_CONFIG is set per-directory by the identity routing hook, and only for
# an identity that declares gcloud. Keying the module to it means the segment says
# what it means: a cloud identity is in force here, and this is who. Elsewhere it
# stays quiet rather than showing a symbol for an account that does not exist.
#
# Trade-off: a personal `gcloud auth login` would go unshown, since personal has
# no generated config dir. That is the identity model's own rule — the folder is
# the switch — not an oversight.
[gcloud]
detect_env_vars = ["CLOUDSDK_CONFIG"]

# Git
[git_branch]
style = "fg:white bg:black"

#[git_status]
#style = "fg:#E29191"
[git_status]
conflicted = " 🏳 "
ahead = " 🏎  💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 "
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " 👅 "
deleted = " 🗑  "

# Language Environments
[package]
style = "bold fg:#5E5E5E"

[python]
style = "bold fg:#5E5E5E"
symbol = "[](bold yellow) "

[nodejs]
style = "bold fg:#5E5E5E"
symbol = "[⬢](bold green) "

[sudo]
style = "bold green"
symbol = "👩💻 "
disabled = false

# CPU + RAM, from the shared ~/.local/bin/sysusage script (same reading Claude
# Code and the SwiftBar menu bar use). Absolute path so it resolves whatever
# subshell Starship spawns; dim like the language-env segments.
[custom.sysusage]
command = "$HOME/.local/bin/sysusage"
when = "true"
format = "[$output]($style) "
style = "fg:#5E5E5E"
